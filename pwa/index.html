<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#00e599">
  <meta name="description" content="Aplikasi Face Recognition, Estimasi Usia & Gender On-Device berbasis InsightFace dan ONNX Runtime Web">
  <title>FaceAI</title>

  <!-- PWA Manifest & Icons -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Typography: Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styling -->
  <link rel="stylesheet" href="css/style.css">

  <!-- ONNX Runtime Web -->
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
</head>
<body>
  <div id="app-container">

    <!-- Top HUD Banner -->
    <header class="top-hud">
      <div class="brand-badge">
        <div class="brand-logo-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00e599" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 7V5a2 2 0 0 1 2-2h2"></path>
            <path d="M17 3h2a2 2 0 0 1 2 2v2"></path>
            <path d="M21 17v2a2 2 0 0 1-2 2h-2"></path>
            <path d="M7 21H5a2 2 0 0 1-2-2v-2"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
        <div>
          <h1 class="brand-title">FaceAI</h1>
          <div class="brand-sub" id="status-text">Memuat Engine...</div>
        </div>
      </div>

      <div class="hud-metrics">
        <div class="metric-pill" id="fps-pill">
          <div class="status-dot" id="status-pill"></div>
          <span>FPS: <strong id="fps-val">--</strong></span>
        </div>
        <div class="metric-pill" id="db-pill">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
            <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
            <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
          </svg>
          <span id="db-count">0 Wajah</span>
        </div>
      </div>
    </header>

    <!-- Camera Viewport & Overlay Canvas -->
    <main class="camera-stage">
      <video id="camera-video" playsinline autoplay muted></video>
      <canvas id="overlay-canvas"></canvas>
      <div class="scan-laser"></div>
    </main>

    <!-- Bottom Floating Action Bar -->
    <footer class="bottom-controls">
      <!-- Flip Camera -->
      <button class="btn-circle" id="btn-flip-cam" title="Balik Kamera" aria-label="Balik Kamera">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 10c0-4.418-3.582-8-8-8s-8 3.582-8 8c0 1.94.694 3.72 1.854 5.106L3.5 17.5H8v-4.5l-1.636 1.636C5.502 13.447 5 11.785 5 10c0-3.866 3.134-7 7-7s7 3.134 7 7-3.134 7-7 7c-1.554 0-2.986-.507-4.146-1.364L6.44 17.05A8.96 8.96 0 0 0 12 19c4.418 0 8-3.582 8-8z"/>
        </svg>
      </button>

      <!-- Toggle Age -->
      <button class="btn-circle active" id="btn-toggle-age" title="Toggle Usia" aria-label="Toggle Usia">
        <span style="font-weight: 700; font-size: 0.85rem;">AGE</span>
      </button>

      <!-- Shutter Snap (Pendaftaran Wajah) -->
      <button class="btn-shutter" id="btn-shutter" title="Daftarkan Wajah" aria-label="Ambil & Daftarkan Wajah"></button>

      <!-- Toggle Gender -->
      <button class="btn-circle active" id="btn-toggle-gender" title="Toggle Gender" aria-label="Toggle Gender">
        <span style="font-weight: 700; font-size: 0.85rem;">GEN</span>
      </button>

      <!-- Database Manager -->
      <button class="btn-circle" id="btn-open-db" title="Database Wajah" aria-label="Daftar Wajah Tersimpan">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
          <circle cx="9" cy="7" r="4"></circle>
          <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
          <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
        </svg>
      </button>
    </footer>

    <!-- Enrollment Modal -->
    <div class="modal-overlay" id="enroll-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00e599" stroke-width="2">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="8.5" cy="7" r="4"></circle>
              <line x1="20" y1="8" x2="20" y2="14"></line>
              <line x1="23" y1="11" x2="17" y2="11"></line>
            </svg>
            Daftarkan Wajah Baru
          </h2>
          <button class="modal-close" id="enroll-close" aria-label="Tutup">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <div class="snap-preview-wrap">
          <img id="enroll-thumb" class="snap-preview-img" alt="Snapshot Wajah">
          <div class="estimated-badge" id="enroll-age-badge">Estimasi Usia: ~25 th</div>
        </div>

        <div class="input-group">
          <label class="input-label" for="enroll-name-input">Nama Lengkap Orang:</label>
          <input type="text" id="enroll-name-input" class="input-field" placeholder="Misal: Budi Santoso" autocomplete="off" autocorrect="off">
        </div>

        <div class="modal-actions">
          <button class="btn-secondary" id="enroll-cancel">Batal</button>
          <button class="btn-primary" id="enroll-save">Simpan Wajah</button>
        </div>
      </div>
    </div>

    <!-- Database Inspector Modal -->
    <div class="modal-overlay" id="db-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#00c2ff" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Database Wajah Terdaftar
          </h2>
          <button class="modal-close" id="db-close" aria-label="Tutup">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
          </button>
        </div>

        <div class="db-list" id="db-list">
          <!-- Item database terisi secara dinamis -->
        </div>

        <div class="modal-actions" style="margin-top: 14px;">
          <button class="btn-secondary" id="db-clear-all" style="color: #ff4757; border-color: rgba(255, 71, 87, 0.3);">Hapus Semua</button>
        </div>
      </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast-msg" id="toast-msg">Notifikasi</div>

    <!-- Install PWA Banner -->
    <div class="install-banner" id="install-banner">
      <div>
        <div style="font-weight: 700; font-size: 0.95rem; color: #fff;">Install Aplikasi FaceAI</div>
        <div style="font-size: 0.76rem; color: var(--text-muted);">Jalankan standalone di HP tanpa browser bar</div>
      </div>
      <button class="btn-primary" id="install-banner-btn" style="padding: 8px 16px; font-size: 0.85rem; flex: none;">Install APK</button>
    </div>

  </div>

  <!-- Application Logic -->
  <script src="js/db.js"></script>
  <script src="js/face_engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
