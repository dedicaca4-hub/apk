name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install NPM Dependencies
        run: |
          npm install

      - name: Add & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Configure Android Permissions in AndroidManifest.xml
        run: |
          python3 -c "
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r', encoding='utf-8') as f:
              data = f.read()
          perms = '''    <uses-permission android:name=\"android.permission.CAMERA\" />
      <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />
      <uses-feature android:name=\"android.hardware.camera.autofocus\" android:required=\"false\" />
  <application'''
          if 'android.permission.CAMERA' not in data:
              data = data.replace('<application', perms)
              with open(manifest_path, 'w', encoding='utf-8') as f:
                  f.write(data)
          print('AndroidManifest updated successfully!')
          "

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Output
        run: |
          mkdir -p output-apk
          cp android/app/build/outputs/apk/debug/app-debug.apk output-apk/FaceAI-v1.0-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FaceAI-v1.0-APK
          path: output-apk/FaceAI-v1.0-debug.apk
          retention-days: 30
